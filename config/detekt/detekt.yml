build:
  maxIssues: 0
  excludes:
    - "**/build/**"
    - "**/generated/**"

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true
  exclude:
    - 'TxtOutputReport'
    - 'XmlOutputReport'

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    nestingFunctions:
      - "also"
      - "apply"
      - "forEach"
      - "isNotNull"
      - "ifNull"
      - "let"
      - "run"
      - "use"
      - "with"
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInClasses: 15
    thresholdInFiles: 15
    ignorePrivate: false
    ignoreOverridden: true

exceptions:
  active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - "InterruptedException"
      - "MalformedURLException"
      - "NumberFormatException"
      - "ParseException"
      - "PendingIntent.CanceledException"
      - "Exception"
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - "e"
      - "ex"
      - "t"
      - "throwable"

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - "Composable"

style:
  active: true
  BracesOnIfStatements:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  WildcardImport:
    active: true
    excludeImports:
      - "java.util.*"
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MandatoryBracesLoops:
    active: true
  OptionalUnit:
    active: true
  RedundantExplicitType:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  ReturnCount:
    active: true
    max: 3
    excludedFunctions:
      - "equals"
  ThrowsCount:
    active: true
    max: 2
  UnnecessaryLet:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true
